name: Weekday medical appointment tests

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Cucumber tests
        run: npm test
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          EXPECTED_USER_EMAIL: ${{ secrets.EXPECTED_USER_EMAIL }}
          HEADLESS: true
      - name: Generate Allure report
        if: always()
        run: npm run report:allure
      - name: Prepare browsable reports
        if: always()
        run: |
          mkdir -p public/allure public/cucumber public/test-results
          cp -R allure-report/. public/allure/ 2>/dev/null || true
          cp reports/cucumber-report.html public/cucumber/index.html 2>/dev/null || true
          cp -R test-results/. public/test-results/ 2>/dev/null || true
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head><meta charset="utf-8"><title>Test reports</title></head>
            <body>
              <h1>Test reports</h1>
              <ul>
                <li><a href="allure/">Allure report</a></li>
                <li><a href="cucumber/">Cucumber HTML report</a></li>
                <li><a href="test-results/">Failure screenshots</a></li>
              </ul>
            </body>
          </html>
          EOF
      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5
      - name: Upload browsable reports
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy browsable reports
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
